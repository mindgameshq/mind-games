<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MINDWEAVER — Monopoly Rebuild</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{color-scheme:dark;--gold:#d7ad58;--ink:#080d12}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#f4f0e7;font-family:Inter,system-ui,Arial,sans-serif}
#scene{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2vw,26px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand,.status,.controls{background:linear-gradient(145deg,rgba(19,29,38,.94),rgba(8,13,18,.88));border:1px solid rgba(215,173,88,.35);box-shadow:0 12px 40px #0008;backdrop-filter:blur(14px);border-radius:16px}
.brand{padding:13px 17px}
.brand b{display:block;letter-spacing:.19em;color:var(--gold);font-size:12px}
.brand span{display:block;margin-top:4px;font-size:11px;color:#aeb9c2;letter-spacing:.12em}
.status{padding:12px 16px;text-align:right;font-size:12px;color:#b9c4cc}
.status strong{display:block;color:#f4f0e7;font-size:16px;margin-top:3px}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}
.hint{max-width:360px;padding:12px 15px;border-radius:13px;background:#0b1219d9;border:1px solid #ffffff18;color:#b8c2ca;font-size:12px;line-height:1.5}
.controls{pointer-events:auto;display:flex;gap:8px;padding:9px}
button{appearance:none;border:1px solid #d7ad5866;border-radius:10px;background:linear-gradient(180deg,#d9b76f,#a77b32);color:#17120a;padding:11px 15px;font-weight:800;cursor:pointer;min-width:82px}
button.secondary{background:#18232d;color:#e8e1d2;border-color:#ffffff26}
button:disabled{opacity:.5;cursor:not-allowed}
button:active{transform:translateY(1px)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#080d12;color:#d7ad58;letter-spacing:.2em;font-size:12px;z-index:5;transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
#cardOverlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);pointer-events:auto}
#cardOverlay.show{display:grid}
.chestCard{width:min(380px,100%);padding:30px 22px;text-align:center;border:2px solid #d7ad58;border-radius:22px;background:linear-gradient(145deg,#173c32,#101a20);box-shadow:0 20px 80px #000;animation:cardReveal .45s ease-out}
.chestIcon{font-size:55px}
.chestLabel{color:#d7ad58;letter-spacing:.22em;font-size:10px;margin:12px 0}
.chestCard h2{color:#e9c77d;font-size:23px;letter-spacing:.08em}
#cardMessage{margin:22px 0;font-size:17px;line-height:1.6}
#cardAmount{font-size:27px;font-weight:900;color:#8ce36b;margin:15px 0}
#cardBalance{color:#c4ced5;font-size:13px;margin-bottom:20px}
#jailActions{display:none;gap:12px;flex-direction:column;margin:20px 0}
@keyframes cardReveal{from{transform:scale(.75) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@media(max-width:600px){
.status{font-size:10px;padding:10px}
.status strong{font-size:13px}
.hint{font-size:10px;max-width:190px}
.controls{gap:5px;padding:6px}
button{min-width:66px;padding:10px 9px;font-size:11px}
.brand{padding:10px 12px}
}
</style>
</head>
<body>

<div id="scene"></div>
<div id="loading">BUILDING THE BOARD…</div>

<div id="hud">
  <div class="top">
    <div class="brand"><b>MINDWEAVER</b><span>MONOPOLY · REBUILT</span></div>
    <div class="status" id="turnStatus">PLAYER 1 TURN<strong>ROLL TO MOVE</strong></div>
  </div>
  <div class="bottom">
    <div class="hint">Drag to orbit · Scroll or pinch to zoom. Four player characters are active: roll the dice to move the current player around the board.</div>
    <div class="controls">
      <button class="secondary" id="reset">RESET VIEW</button>
      <button id="roll">ROLL DICE</button>
    </div>
  </div>
</div>

<div id="cardOverlay">
  <div class="chestCard">
    <div class="chestIcon">🎁</div>
    <div class="chestLabel">MINDWEAVER BANK</div>
    <h2 id="cardTitle">COMMUNITY CHEST</h2>
    <div id="cardMessage">Your community has a surprise!</div>
    <div id="cardAmount"></div>
    <div id="cardBalance"></div>

    <div id="jailActions">
      <button id="payBail">PAY ₦100,000 BAIL</button>
      <button id="useJailCard" class="secondary">USE GET OUT OF JAIL FREE</button>
      <button id="serveJail" class="secondary">SERVE JAIL TURN</button>
    </div>

    <button id="collectCard">CONTINUE</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const host=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d12);
scene.fog=new THREE.Fog(0x080d12,24,48);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(0,21,25);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=13;
controls.maxDistance=38;
controls.maxPolarAngle=Math.PI*.47;
controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xc8d9ec,0x382719,2));

const key=new THREE.DirectionalLight(0xffe1a5,3.2);
key.position.set(-8,16,10);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-18;
key.shadow.camera.right=18;
key.shadow.camera.top=18;
key.shadow.camera.bottom=-18;
scene.add(key);

const rim=new THREE.PointLight(0x4d8fbd,45,35);
rim.position.set(10,8,-10);
scene.add(rim);

const mat=(color,roughness=.65,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const wood=mat(0x49301f,.38);
const felt=mat(0x174d43,.82);
const tileMat=mat(0xf0e7d4,.72);
const gold=mat(0xc69a4b,.3,.72);
const dark=mat(0x111820,.5,.2);

function box(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function textSprite(text,color='#20252a',bg='rgba(255,255,255,0)',size=64){
 const c=document.createElement('canvas');
 const ctx=c.getContext('2d');
 c.width=512;
 c.height=128;
 ctx.clearRect(0,0,c.width,c.height);
 if(bg!=='rgba(255,255,255,0)'){
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,c.width,c.height);
 }
 ctx.fillStyle=color;
 ctx.font=`bold ${size}px Arial`;
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText(text,256,64,480);
 const tex=new THREE.CanvasTexture(c);
 tex.colorSpace=THREE.SRGBColorSpace;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
 s.scale.set(2,.5,1);
 return s;
}

// Board base
box(22,.7,22,wood,0,-.5,0);
box(21.4,.12,21.4,gold,0,-.08,0);
box(21,.16,21,felt,0,.04,0);
box(15,.025,15,mat(0x1c5a4b,.9),0,.14,0);

for(const [w,d,x,z] of [
 [15.4,.035,0,-7.7],
 [15.4,.035,0,7.7],
 [.035,15.4,-7.7,0],
 [.035,15.4,7.7,0]
])box(w,.025,d,gold,x,.17,z);

// Board spaces
const spaces=[
'GO','OLD KENT ROAD','COMMUNITY CHEST','WHITECHAPEL ROAD','INCOME TAX','KINGS CROSS','THE ANGEL ISLINGTON','CHANCE','EUSTON ROAD','PENTONVILLE ROAD','JAIL / VISITING',
'PALL MALL','ELECTRIC COMPANY','WHITEHALL','NORTHUMBERLAND AVENUE','MARYLEBONE STATION','BOW STREET','COMMUNITY CHEST','MARLBOROUGH STREET','VINE STREET','FREE PARKING',
'STRAND','CHANCE','FLEET STREET','TRAFALGAR SQUARE','FENCHURCH STATION','LEICESTER SQUARE','COVENTRY STREET','WATER WORKS','PICCADILLY','GO TO JAIL',
'REGENT STREET','OXFORD STREET','COMMUNITY CHEST','BOND STREET','LIVERPOOL STREET STATION','CHANCE','PARK LANE','SUPER TAX','MAYFAIR'
];

const groups={
 1:0x8b5a9e,3:0x8b5a9e,6:0x9bcbd7,8:0x9bcbd7,9:0x9bcbd7,
 11:0xd95783,13:0xd95783,14:0xd95783,16:0xf28d42,18:0xf28d42,19:0xf28d42,
 21:0xe64d45,23:0xe64d45,24:0xe64d45,26:0xf0d34d,27:0xf0d34d,29:0xf0d34d,
 31:0x3f9b68,32:0x3f9b68,34:0x3f9b68,37:0x2874bb,39:0x2874bb
};

const positions=[];
const edge=10,step=2;

for(let i=0;i<11;i++)positions.push({x:edge-i*step,z:edge,rot:0});
for(let i=1;i<11;i++)positions.push({x:-edge,z:edge-i*step,rot:Math.PI/2});
for(let i=1;i<11;i++)positions.push({x:-edge+i*step,z:-edge,rot:Math.PI});
for(let i=1;i<10;i++)positions.push({x:edge,z:-edge+i*step,rot:-Math.PI/2});

spaces.forEach((name,i)=>{
 const p=positions[i];
 if(!p)return;
 const corner=[0,10,20,30].includes(i);
 const w=corner?2.45:1.72;
 const d=corner?2.45:1.72;
 const groupColor=groups[i];

 const tile=box(w,.18,d,tileMat,p.x,.28,p.z);
 tile.rotation.y=p.rot;

 if(groupColor){
  const strip=box(corner?2.1:1.48,.08,.32,mat(groupColor,.55),p.x,.41,p.z);
  strip.rotation.y=p.rot;
  strip.position.x+=Math.sin(p.rot)*.57;
  strip.position.z+=Math.cos(p.rot)*.57;
 }

 const label=textSprite(name,'#20252a','rgba(255,255,255,0)',corner?43:29);
 label.position.set(p.x,.43,p.z);
 label.scale.set(corner?1.7:1.55,.39,1);
 label.material.rotation=p.rot;
 scene.add(label);
});

// Central plaque
box(8,.12,2.5,dark,0,.28,0);

const title=textSprite('MINDWEAVER','#e2bd72');
title.position.set(0,.42,-.35);
title.scale.set(5.8,1,1);
scene.add(title);

const sub=textSprite('THE CLASSIC PROPERTY TRADING GAME','#b7c8c0');
sub.position.set(0,.4,.65);
sub.scale.set(4.8,.42,1);
scene.add(sub);

for(let i=0;i<4;i++){
 const a=i*Math.PI/2;
 const x=Math.cos(a)*4.4;
 const z=Math.sin(a)*4.4;
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.045,8,48),gold);
 ring.rotation.x=Math.PI/2;
 ring.position.set(x,.35,z);
 scene.add(ring);
}

// Players
const playerColors=[0x55c8ff,0xff647c,0x8ce36b,0xc69aff];
const playerNames=['PLAYER 1','PLAYER 2','PLAYER 3','PLAYER 4'];

const playerOffsets=[
 {x:-.48,z:-.48},
 {x:.48,z:-.48},
 {x:-.48,z:.48},
 {x:.48,z:.48}
];

const playerTokens=[];
const playerPositions=[0,0,0,0];
const playerCash=[2000000,2000000,2000000,2000000];

const JAIL_BAIL=100000;
const playerInJail=[false,false,false,false];
const jailTurns=[0,0,0,0];
const getOutOfJailFree=[false,false,false,false];

let activePlayer=0;
let characterMoving=false;
let rolling=false;

function makeCharacter(color,index){
 const group=new THREE.Group();
 const mainMat=mat(color,.3,.25);
 const trimMat=mat(0xf4e4bd,.28,.55);
 const darkMat=mat(0x17202a,.38,.15);

 const base=new THREE.Mesh(new THREE.CylinderGeometry(.34,.39,.13,32),trimMat);
 base.position.y=.49;
 group.add(base);

 const footRing=new THREE.Mesh(new THREE.TorusGeometry(.25,.035,8,32),mainMat);
 footRing.rotation.x=Math.PI/2;
 footRing.position.y=.57;
 group.add(footRing);

 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.34,6,12),mainMat);
 torso.position.y=.91;
 group.add(torso);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.17,20,16),mat(0xf0c7a0,.52));
 head.position.y=1.25;
 group.add(head);

 const hair=new THREE.Mesh(new THREE.SphereGeometry(.174,18,12,0,Math.PI*2,0,Math.PI*.55),darkMat);
 hair.position.y=1.29;
 group.add(hair);

 const arms=[];
 [-1,1].forEach(side=>{
  const pivot=new THREE.Group();
  pivot.position.set(side*.22,1.04,0);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.22,4,8),mainMat);
  arm.position.y=-.13;
  pivot.add(arm);
  group.add(pivot);
  arms.push(pivot);
 });

 const legs=[];
 [-1,1].forEach(side=>{
  const pivot=new THREE.Group();
  pivot.position.set(side*.105,.59,0);
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.20,4,8),darkMat);
  leg.position.y=-.12;
  pivot.add(leg);
  group.add(pivot);
  legs.push(pivot);
 });

 const badge=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),trimMat);
 badge.position.set(0,.93,.16);
 group.add(badge);

 group.userData.playerIndex=index;
 group.userData.arms=arms;
 group.userData.legs=legs;
 return group;
}

function positionCharacter(token,spaceIndex,playerIndex){
 const point=positions[spaceIndex];
 const offset=playerOffsets[playerIndex];
 token.position.set(point.x+offset.x,.05,point.z+offset.z);
 token.rotation.y=Math.atan2(-point.x,-point.z);
}

for(let i=0;i<4;i++){
 const character=makeCharacter(playerColors[i],i);
 scene.add(character);
 positionCharacter(character,0,i);
 playerTokens.push(character);
}

function updateTurnStatus(message){
 document.querySelector('#turnStatus').innerHTML=
  `${playerNames[activePlayer]} TURN<strong>${message}</strong>`;
}

// Card decks
const communityCards=[
 {message:"The bank rewards your excellent service!",amount:100000},
 {message:"You received an unexpected family gift!",amount:50000},
 {message:"Your investment has paid off!",amount:250000},
 {message:"You won a community lottery!",amount:150000},
 {message:"Your insurance refund has arrived!",amount:75000},
 {message:"Hospital expenses. Pay your medical bill!",amount:-40000},
 {message:"You have unpaid school fees!",amount:-30000},
 {message:"Your property needs urgent repairs!",amount:-60000},
 {message:"You received a traffic violation fine!",amount:-25000},
 {message:"Unexpected expenses! Pay the bank!",amount:-100000}
];

const chanceCards=[
 {message:"The bank pays you a generous dividend!",amount:200000},
 {message:"You won a business investment prize!",amount:150000},
 {message:"Your shares have increased in value!",amount:300000},
 {message:"You received a surprise bonus!",amount:100000},
 {message:"Pay a luxury tax to the bank!",amount:-100000},
 {message:"Your vehicle needs expensive repairs!",amount:-75000},
 {message:"Pay your outstanding loan!",amount:-200000},

 {message:"You were caught committing a financial offence. Go directly to Jail!",type:"jail"},
 {message:"You violated the city regulations. Go directly to Jail!",type:"jail"},
 {message:"You were arrested for trespassing. Go directly to Jail!",type:"jail"},
 {message:"You ignored a court summons. Go directly to Jail!",type:"jail"},

 {message:"You received a Get Out of Jail Free card!",type:"jailfree"}
];

// Shuffle the Chance deck and draw without replacement.
let shuffledChanceCards=[];

function drawChanceCard(){
 if(shuffledChanceCards.length===0){
  shuffledChanceCards=[...chanceCards];

  for(let i=shuffledChanceCards.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [shuffledChanceCards[i],shuffledChanceCards[j]]=
   [shuffledChanceCards[j],shuffledChanceCards[i]];
  }
 }

 return shuffledChanceCards.pop();
}

function updateCardBalance(playerIndex){
 document.querySelector('#cardBalance').textContent=
  `PLAYER ${playerIndex+1} BALANCE: ₦${playerCash[playerIndex].toLocaleString('en-NG')}`;
}

function openJailOptions(playerIndex,onFinish){
 const overlay=document.querySelector('#cardOverlay');
 const actions=document.querySelector('#jailActions');
 const collect=document.querySelector('#collectCard');
 const bail=document.querySelector('#payBail');
 const jailCard=document.querySelector('#useJailCard');
 const serve=document.querySelector('#serveJail');

 document.querySelector('#cardTitle').textContent='GO TO JAIL';
 document.querySelector('.chestIcon').textContent='🚔';
 document.querySelector('.chestLabel').textContent='MINDWEAVER POLICE DEPARTMENT';

 document.querySelector('#cardMessage').textContent=
  `PLAYER ${playerIndex+1} IS IN JAIL. Choose how to proceed.`;

 document.querySelector('#cardAmount').textContent='IN JAIL 👮‍♂️';
 document.querySelector('#cardAmount').style.color='#ff647c';

 updateCardBalance(playerIndex);

 actions.style.display='flex';
 collect.style.display='none';

 bail.style.display='block';
 jailCard.style.display=getOutOfJailFree[playerIndex]?'block':'none';
 serve.style.display='block';

 function finish(){
  overlay.classList.remove('show');
  actions.style.display='none';
  onFinish();
 }

 bail.onclick=()=>{
  if(playerCash[playerIndex]<JAIL_BAIL){
   document.querySelector('#cardMessage').textContent=
    'INSUFFICIENT FUNDS! You need ₦100,000 to pay bail.';
   return;
  }

  playerCash[playerIndex]-=JAIL_BAIL;
  playerInJail[playerIndex]=false;
  jailTurns[playerIndex]=0;

  document.querySelector('#cardAmount').textContent='−₦100,000 BAIL PAID';
  updateCardBalance(playerIndex);
  finish();
 };

 jailCard.onclick=()=>{
  if(!getOutOfJailFree[playerIndex])return;

  getOutOfJailFree[playerIndex]=false;
  playerInJail[playerIndex]=false;
  jailTurns[playerIndex]=0;

  document.querySelector('#cardAmount').textContent='JAIL FREE CARD USED';
  finish();
 };

 serve.onclick=()=>{
  jailTurns[playerIndex]++;
  document.querySelector('#cardMessage').textContent=
   'You remain in Jail. Your turn has been served.';
  finish();
 };

 overlay.classList.add('show');
}

function showNormalCard(playerIndex,card,isCommunity){
 const overlay=document.querySelector('#cardOverlay');
 const actions=document.querySelector('#jailActions');
 const collect=document.querySelector('#collectCard');

 actions.style.display='none';
 collect.style.display='block';

 document.querySelector('#cardTitle').textContent=
  isCommunity?'COMMUNITY CHEST':'CHANCE';

 document.querySelector('.chestIcon').textContent=
  isCommunity?'🎁':'🎲';

 document.querySelector('.chestLabel').textContent=
  isCommunity?'MINDWEAVER BANK':'MINDWEAVER CHANCE';

 document.querySelector('#cardMessage').textContent=card.message;

 const amountElement=document.querySelector('#cardAmount');

 if(card.type==='jailfree'){
  amountElement.textContent='CARD KEPT';
  amountElement.style.color='#e9c77d';
 }else{
  amountElement.textContent=
   (card.amount>=0?'+':'−')+
   '₦'+Math.abs(card.amount).toLocaleString('en-NG');

  amountElement.style.color=card.amount>=0?'#8ce36b':'#ff647c';
 }

 updateCardBalance(playerIndex);

 return new Promise(resolve=>{
  collect.onclick=()=>{
   overlay.classList.remove('show');
   resolve();
  };
  overlay.classList.add('show');
 });
}

function resolveLanding(playerIndex){
 const space=playerPositions[playerIndex];

 const isCommunity=[2,17,33].includes(space);
 const isChance=[7,22,36].includes(space);
 const isGoToJail=space===30;

 if(isGoToJail){
  playerInJail[playerIndex]=true;
  jailTurns[playerIndex]=0;
  playerPositions[playerIndex]=10;

  positionCharacter(playerTokens[playerIndex],10,playerIndex);

  return new Promise(resolve=>{
   openJailOptions(playerIndex,resolve);
  });
 }

 if(!isCommunity&&!isChance)return Promise.resolve();

 const card=isChance
  ?drawChanceCard()
  :communityCards[Math.floor(Math.random()*communityCards.length)];

 if(card.type==='jail'){
  playerInJail[playerIndex]=true;
  jailTurns[playerIndex]=0;
  playerPositions[playerIndex]=10;

  positionCharacter(playerTokens[playerIndex],10,playerIndex);

  return new Promise(resolve=>{
   openJailOptions(playerIndex,resolve);
  });
 }

 if(card.type==='jailfree'){
  getOutOfJailFree[playerIndex]=true;
 }else if(typeof card.amount==='number'){
  playerCash[playerIndex]+=card.amount;
 }

 return showNormalCard(playerIndex,card,isCommunity);
}

// Handle the jailed player's turn.
// They cannot roll or move while still in Jail.
function handleJailedTurn(playerIndex){
 openJailOptions(playerIndex,()=>{
  activePlayer=(activePlayer+1)%4;
  updateTurnStatus('ROLL TO MOVE');
 });
}

function movePlayer(playerIndex,steps){
 return new Promise(resolve=>{
  const token=playerTokens[playerIndex];

  characterMoving=true;
  updateTurnStatus(`MOVING ${steps} SPACES`);

  let moved=0;
  let stepStart=performance.now();
  const stepDuration=420;
  let from=token.position.clone();

  function animateStep(now){
   const elapsed=now-stepStart;
   const t=Math.min(1,elapsed/stepDuration);
   const eased=t*t*(3-2*t);

   const previousIndex=playerPositions[playerIndex];
   const nextIndex=(previousIndex+1)%40;
   const point=positions[nextIndex];
   const offset=playerOffsets[playerIndex];

   const target=new THREE.Vector3(
    point.x+offset.x,.05,point.z+offset.z
   );

   const dx=target.x-from.x;
   const dz=target.z-from.z;
   const targetAngle=Math.atan2(dx,dz);

   let angleDiff=targetAngle-token.rotation.y;
   angleDiff=Math.atan2(Math.sin(angleDiff),Math.cos(angleDiff));
   token.rotation.y+=angleDiff*Math.min(1,elapsed/100);

   token.position.lerpVectors(from,target,eased);
   token.position.y=.05+Math.abs(Math.sin(t*Math.PI*2))*.10;

   const swing=Math.sin(t*Math.PI*2)*.65;
   const arms=token.userData.arms;
   const legs=token.userData.legs;

   arms[0].rotation.x=swing;
   arms[1].rotation.x=-swing;
   legs[0].rotation.x=-swing;
   legs[1].rotation.x=swing;

   if(t<1){
    requestAnimationFrame(animateStep);
    return;
   }

   token.position.copy(target);
   token.position.y=.05;

   // Award ₦200,000 only when a player passes GO.
   // A jailed player cannot move or collect GO salary.
   if(nextIndex<previousIndex){
    playerCash[playerIndex]+=200000;
   }

   playerPositions[playerIndex]=nextIndex;
   moved++;

   arms.forEach(a=>a.rotation.x=0);
   legs.forEach(l=>l.rotation.x=0);

   if(moved<steps){
    from=token.position.clone();
    stepStart=performance.now();
    requestAnimationFrame(animateStep);
   }else{
    characterMoving=false;

    resolveLanding(playerIndex).then(()=>{
     activePlayer=(activePlayer+1)%4;
     updateTurnStatus('ROLL TO MOVE');
     resolve();
    });
   }
  }

  requestAnimationFrame(animateStep);
 });
}

// Dice
function makeDie(x,z){
 const g=new THREE.Group();
 g.position.set(x,.65,z);
 scene.add(g);

 const cube=new THREE.Mesh(
  new THREE.BoxGeometry(.72,.72,.72),
  mat(0xf5f1e8,.28)
 );
 cube.castShadow=true;
 cube.receiveShadow=true;
 g.add(cube);

 const pipMat=mat(0x17202a,.35);

 const layouts={
  1:[[0,0]],
  2:[[-.17,-.17],[.17,.17]],
  3:[[-.17,-.17],[0,0],[.17,.17]],
  4:[[-.17,-.17],[-.17,.17],[.17,-.17],[.17,.17]],
  5:[[-.17,-.17],[-.17,.17],[0,0],[.17,-.17],[.17,.17]],
  6:[[-.17,-.19],[-.17,0],[-.17,.19],[.17,-.19],[.17,0],[.17,.19]]
 };

 const faceDefs=[
  {normal:new THREE.Vector3(0,0,1),u:new THREE.Vector3(1,0,0),v:new THREE.Vector3(0,1,0),value:1},
  {normal:new THREE.Vector3(0,0,-1),u:new THREE.Vector3(-1,0,0),v:new THREE.Vector3(0,1,0),value:6},
  {normal:new THREE.Vector3(1,0,0),u:new THREE.Vector3(0,0,-1),v:new THREE.Vector3(0,1,0),value:2},
  {normal:new THREE.Vector3(-1,0,0),u:new THREE.Vector3(0,0,1),v:new THREE.Vector3(0,1,0),value:5},
  {normal:new THREE.Vector3(0,1,0),u:new THREE.Vector3(1,0,0),v:new THREE.Vector3(0,0,-1),value:3},
  {normal:new THREE.Vector3(0,-1,0),u:new THREE.Vector3(1,0,0),v:new THREE.Vector3(0,0,1),value:4}
 ];

 faceDefs.forEach(face=>{
  layouts[face.value].forEach(([a,b])=>{
   const pip=new THREE.Mesh(new THREE.SphereGeometry(.052,14,10),pipMat);
   pip.position.copy(face.normal.clone().multiplyScalar(.366))
    .add(face.u.clone().multiplyScalar(a))
    .add(face.v.clone().multiplyScalar(b));
   g.add(pip);
  });
 });

 return g;
}

const dice=[makeDie(-1.3,0),makeDie(-.35,.4)];
const rollStatus=document.querySelector('.status');

function orientationForTop(value){
 const face=({
  1:new THREE.Vector3(0,0,1),
  6:new THREE.Vector3(0,0,-1),
  2:new THREE.Vector3(1,0,0),
  5:new THREE.Vector3(-1,0,0),
  3:new THREE.Vector3(0,1,0),
  4:new THREE.Vector3(0,-1,0)
 })[value];

 return new THREE.Quaternion().setFromUnitVectors(
  face,new THREE.Vector3(0,1,0)
 );
}

// Roll button
document.querySelector('#roll').addEventListener('click',()=>{
 if(rolling||characterMoving)return;

 // A jailed player cannot roll or move.
 if(playerInJail[activePlayer]){
  handleJailedTurn(activePlayer);
  return;
 }

 rolling=true;

 const button=document.querySelector('#roll');
 button.disabled=true;

 const values=dice.map(()=>1+Math.floor(Math.random()*6));
 const total=values[0]+values[1];

 rollStatus.innerHTML=
  `DICE RESULT<strong>${values[0]} + ${values[1]} = ${total}</strong>`;

 const start=performance.now();
 const duration=1350;
 const from=dice.map(d=>d.quaternion.clone());
 const targets=values.map(v=>orientationForTop(v));

 const spins=[
  new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI*6),
  new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI*7)
 ];

 const end=targets.map((q,i)=>spins[i].clone().multiply(q));

 function animateRoll(now){
  const t=Math.min(1,(now-start)/duration);
  const ease=1-Math.pow(1-t,3);

  dice.forEach((d,i)=>{
   const tumble=new THREE.Quaternion().slerpQuaternions(from[i],end[i],ease);
   d.quaternion.copy(tumble);
   d.position.y=.65+Math.sin(t*Math.PI*9)*(1-t)*.48;
  });

  if(t<1){
   requestAnimationFrame(animateRoll);
  }else{
   dice.forEach((d,i)=>{
    d.quaternion.copy(targets[i]);
    d.position.y=.65;
   });

   rolling=false;

   movePlayer(activePlayer,total).then(()=>{
    button.disabled=false;
   });
  }
 }

 requestAnimationFrame(animateRoll);
});

document.querySelector('#reset').addEventListener('click',()=>{
 camera.position.set(0,21,25);
 controls.target.set(0,0,0);
 controls.update();
});

// Ground
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 mat(0x080d12,.95)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.92;
floor.receiveShadow=true;
scene.add(floor);

// Resize
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// Animation loop
function tick(){
 requestAnimationFrame(tick);
 controls.update();
 renderer.render(scene,camera);
}

tick();
document.querySelector('#loading').classList.add('hidden');

</script>
